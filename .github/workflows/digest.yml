name: AI Reader digest

on:
  schedule:
    # 06:47 UTC = 07:47 czasu polskiego zimą (08:47 latem). GitHub cron działa w UTC.
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tylko podgląd (nie wysyłaj na Discord)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-reader
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zbierz i wyślij artykuły
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m ai_reader.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Zapisz stan deduplikacji
        run: |
          if ! git diff --quiet -- state/seen.json; then
            git config user.name "ai-reader-bot"
            git config user.email "ai-reader-bot@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: aktualizacja seen.json [skip ci]"
            git push
          fi
